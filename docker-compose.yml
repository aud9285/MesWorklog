services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mes
    ports:
      # 127.0.0.1로만 바인딩 — 이 호스트 자신만 접속 가능, 인터넷엔 노출 안 됨.
      # DBeaver 등 외부 클라이언트는 SSH 터널로 이 포트에 붙는다(3306을 보안 그룹에 열 필요 없음)
      - "127.0.0.1:3306:3306"
    # 한글 깨짐 방지 — 시드 데이터 넣을 때 겪었던 문제를 서버 기본값으로 막는다
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # 이름 있는 볼륨 — 컨테이너를 지우고 다시 만들어도 데이터가 남는다
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .                        # 레포 루트 (Dockerfile이 frontend/를 참조하므로)
      dockerfile: MesWorklog/Dockerfile
    ports:
      - "${APP_PORT:-80}:8080"                       
    environment:
      # Server=mysql — localhost가 아니라 "서비스 이름"이 곧 호스트명이다
      ConnectionStrings__MesDb: "Server=mysql;Port=3306;Database=mes;User=root;Password=${MYSQL_ROOT_PASSWORD};CharSet=utf8mb4;"
    depends_on:
      mysql:
        condition: service_healthy      # DB 준비될 때까지 앱 시작을 미룬다
    restart: unless-stopped

volumes:
  mysql-data: